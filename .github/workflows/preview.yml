name: preview

# Publishes a preview build to our own feed, https://code-wicket.dev/previews/feed.atom, on every
# push to main, for anyone who has opted in to the bleeding edge. Stable releases stay on the
# Marketplace (release.yml).
#
# The feed is an Atom file and the VSIX it names, in the R2 bucket the site Worker serves /previews/
# from (site/src/index.js). Not the Open VSIX Gallery: its upload accepts a new version of any
# extension ID from anyone, and its manage token guards only deletion, so a feed there carries
# whatever the last uploader under our ID sent.
#
# Testers add the feed to Visual Studio (docs/getting-started.md) and VS offers each
# preview as an update. The Identity Id is the release's, so a preview REPLACES the installed
# release rather than installing beside it, and the version decides which build a user gets:
#
#   latest release tag v1.0.0  ->  previews 1.0.0.<run>  (all higher than 1.0.0)
#   next release       v1.1.0  ->  higher than every 1.0.0.<run>, so testers move onto it
#
# Users without the feed only ever see the Marketplace, where no four-part version is published.
on:
  push:
    branches:
      - main
    # A change that cannot alter the VSIX is not a new preview.
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - 'marketplace/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time, newest wins: a queued run is replaced by a later push, so an older build
# can never land after a newer one. A run in flight is left to finish.
concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags, to find the latest release

      - name: Compute preview version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # The highest release tag, by version order rather than by date. Only plain vX.Y.Z tags count.
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$latest" ]; then
            echo "::error::No vX.Y.Z release tag found, so there is no release for a preview version to sort above."
            exit 1
          fi
          version="${latest#v}.${GITHUB_RUN_NUMBER}"
          echo "Latest release $latest -> preview $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      display-name: Code Wicket (Preview)
      upload-vsix: true

  # Separate from the build so the R2 credentials are only ever in a job that runs no repository
  # code. They are an R2 API token scoped to Object Read & Write on this one bucket: they can
  # replace a preview, and nothing else on the account.
  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUCKET: code-wicket-previews
      ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Recent AWS CLIs send integrity checksums by default that R2 does not accept on every call.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      FEED_URL: https://code-wicket.dev/previews/feed.atom
      # Previews kept in the bucket. Only the newest is in the feed; the rest are for going back by hand.
      KEEP: 10
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: code-wicket-vsix

      # The entry is read from the manifest INSIDE the VSIX, so the feed cannot describe a
      # different package from the one it names. The shape is the one Visual Studio reads from
      # private galleries: an Atom entry carrying a vsx-syndication <Vsix> block.
      - name: Write the feed
        shell: bash
        run: |
          set -euo pipefail
          unzip -p CodeWicket.VSExtension.vsix extension.vsixmanifest > manifest.xml
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape, quoteattr

          VSX = '{http://schemas.microsoft.com/developer/vsx-schema/2011}'
          root = ET.parse('manifest.xml').getroot()
          meta = root.find(VSX + 'Metadata')
          identity = meta.find(VSX + 'Identity')
          ext_id, version = identity.get('Id'), identity.get('Version')
          feed_url = os.environ['FEED_URL']
          vsix_url = f"{feed_url.rsplit('/', 1)[0]}/{version}/CodeWicket.VSExtension.vsix"
          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          installs = ''
          for target in root.iter(VSX + 'InstallationTarget'):
              arch = target.findtext(VSX + 'ProductArchitecture')
              installs += (f'\n      <Installations><Identifier>{escape(target.get("Id"))}</Identifier>'
                           f'<VersionRange>{escape(target.get("Version"))}</VersionRange>'
                           + (f'<ProductArchitecture>{escape(arch)}</ProductArchitecture>' if arch else '')
                           + '</Installations>')

          feed = f'''<?xml version="1.0" encoding="utf-8"?>
          <feed xmlns="http://www.w3.org/2005/Atom">
            <title type="text">Code Wicket previews</title>
            <id>{escape(feed_url)}</id>
            <updated>{now}</updated>
            <link rel="self" href={quoteattr(feed_url)} />
            <entry>
              <id>{escape(ext_id)}</id>
              <title type="text">{escape(meta.findtext(VSX + 'DisplayName'))}</title>
              <summary type="text">{escape(meta.findtext(VSX + 'Description'))}</summary>
              <published>{now}</published>
              <updated>{now}</updated>
              <author><name>{escape(identity.get('Publisher'))}</name></author>
              <content type="application/octet-stream" src={quoteattr(vsix_url)} />
              <Vsix xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns="http://schemas.microsoft.com/developer/vsx-syndication-schema/2010">
                <Id>{escape(ext_id)}</Id>
                <Version>{escape(version)}</Version>
                <References />
                <Rating xsi:nil="true" />
                <RatingCount xsi:nil="true" />
                <DownloadCount xsi:nil="true" />{installs}
              </Vsix>
            </entry>
          </feed>
          '''
          ET.fromstring(feed.encode('utf-8'))   # well-formed, or the step fails here rather than in VS
          with open('feed.atom', 'w', encoding='utf-8', newline='\n') as f:
              f.write(feed)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'VERSION={version}\n')
          print(f'Feed entry: {ext_id} {version}')
          PY

      # The VSIX goes up before the feed that names it, so the feed never points at a missing file.
      - name: Upload to the preview feed
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp CodeWicket.VSExtension.vsix "s3://$BUCKET/previews/$VERSION/CodeWicket.VSExtension.vsix" \
            --endpoint-url "$ENDPOINT" --content-type application/octet-stream \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp feed.atom "s3://$BUCKET/previews/feed.atom" \
            --endpoint-url "$ENDPOINT" --content-type 'application/atom+xml; charset=utf-8' \
            --cache-control 'no-cache'

      # Read back through the public URLs, so a Worker or binding fault fails the run here rather
      # than reaching testers as an update that never arrives.
      - name: Check the published feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$FEED_URL" | grep -qF "<Version>$VERSION</Version>" \
            || { echo "::error::$FEED_URL does not name $VERSION."; exit 1; }
          expected=$(stat -c %s CodeWicket.VSExtension.vsix)
          actual=$(curl -fsSI "${FEED_URL%/*}/$VERSION/CodeWicket.VSExtension.vsix" | tr -d '\r' \
            | awk 'tolower($1)=="content-length:" {print $2}')
          test "$actual" = "$expected" \
            || { echo "::error::The published VSIX is '$actual' bytes, not $expected."; exit 1; }
          echo "Published $VERSION"

      - name: Prune old previews
        shell: bash
        run: |
          set -euo pipefail
          aws s3 ls "s3://$BUCKET/previews/" --endpoint-url "$ENDPOINT" \
            | awk '$1=="PRE" {sub("/$", "", $2); print $2}' | sort -V | head -n "-$KEEP" \
            | while read -r old; do
                aws s3 rm --recursive "s3://$BUCKET/previews/$old/" --endpoint-url "$ENDPOINT"
              done
