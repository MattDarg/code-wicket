name: release

# Builds the Code Wicket VSIX, runs the offline verification gates, and publishes
# a GitHub Release with the .vsix attached. Triggered by pushing a version tag (v1.2.3)
# or manually via the Actions tab (workflow_dispatch, no release is created then).
# The build and gates live in build.yml, which pull requests run too (ci.yml).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      upload-vsix: true

  # Only publish a Release for tag pushes. Draft so you can review notes before it goes live.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create the Release

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: code-wicket-vsix

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: CodeWicket.VSExtension.vsix
