name: Feature request
description: Suggest something Code Wicket could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, rather than the feature — it helps to know what isn't working for you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
    validations:
      required: false

  - type: dropdown
    id: backend
    attributes:
      label: Which backend does this concern?
      options:
        - Any backend
        - Claude Code
        - Kiro
        - Another ACP agent
    validations:
      required: false
